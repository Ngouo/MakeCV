<!DOCTYPE html>
<html lang="en">
  {%load static%}
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock title %}</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{%static './landing.css'%}" />
    
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <a
        class="navbar-brand mr-5"
        href="#"
        >MakeCV</a
      >
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <i class="fa fa-sort-desc" aria-hidden="true" style="color: white;"></i>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav" >
        <ul class="navbar-nav ms-5" style="font-weight: bold;">
           {% if user.is_authenticated %} 
          <li class="nav-item active">
             <a class="nav-link" class="nav-link text-white" href="{%url 'logout'%}" style="font-weight: bold;">
            <i class="fa fa-sign-out" aria-hidden="true" width="5" height="5"></i>
            Logout  </a
          >
          </li>
          {% else %}
             <li class="nav-item active">
             <a class="nav-link" class="nav-link text-white" href="{%url 'auth'%}" style="font-weight: bold;">
            Login  </a
          >
          </li>  
          <li class="nav-item active">
             <a class="nav-link" class="nav-link text-white" href="{%url 'landing'%}" style="font-weight: bold;">
            Acceuil  </a
          >
          {% endif %}
          <li class="nav-item active">
            <a class="nav-link" href="infos"
              >|  Infos générales <span class="sr-only">(current)</span></a
            >
          </li>
        </ul>
      </div>
    </nav>

    
      {%block content%}{%endblock%}
    

    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
